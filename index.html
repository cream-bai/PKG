<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>颜色模型转换器</title>

<style>
  body {
    font-family: sans-serif;
    background: #f5f5f5;
    padding: 20px;
  }

  .container {
    max-width: 900px;
    margin: auto;
    background: #fff;
    padding: 20px;
    border-radius: 8px;
  }

  .preview {
    width: 100%;
    height: 80px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-bottom: 15px;
  }

  .grid {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }

  .panel {
    flex: 1;
    min-width: 220px;
    border: 1px solid #ddd;
    padding: 15px;
    border-radius: 6px;
  }

  .panel h3 {
    margin-top: 0;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 8px 0;
  }

  .row label {
    width: 20px;
    font-weight: 600;
  }

  .row input[type=text] {
    width: 70px;
    padding: 3px;
    box-sizing: border-box;
  }

  .row input[type=range] {
    flex: 1;
  }

  .picker-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }

  .picker-row input[type=color] {
    width: 40px;
    height: 30px;
    border: none;
    cursor: pointer;
  }
</style>
</head>

<body>

<div class="container">

  <h2>颜色模型转换器</h2>

  <div class="preview" id="preview"></div>

  <div class="grid">

    <!-- RGB -->
    <div class="panel">
      <h3>RGB</h3>

      <div class="row">
        <label>R</label>
        <input type="text" id="rgb-r-i" value="120">
        <input type="range"
               id="rgb-r-s"
               min="0"
               max="255"
               step="1"
               value="120">
      </div>

      <div class="row">
        <label>G</label>
        <input type="text" id="rgb-g-i" value="180">
        <input type="range"
               id="rgb-g-s"
               min="0"
               max="255"
               step="1"
               value="180">
      </div>

      <div class="row">
        <label>B</label>
        <input type="text" id="rgb-b-i" value="200">
        <input type="range"
               id="rgb-b-s"
               min="0"
               max="255"
               step="1"
               value="200">
      </div>

      <div class="picker-row">
        <span>调色板:</span>
        <input type="color" id="rgb-picker" value="#78b4c8">
      </div>
    </div>


    <!-- LAB -->
    <div class="panel">
      <h3>LAB</h3>

      <div class="row">
        <label>L</label>
        <input type="text" id="lab-l-i" value="50">
        <input type="range"
               id="lab-l-s"
               min="0"
               max="100"
               step="0.1"
               value="50">
      </div>

      <div class="row">
        <label>a</label>
        <input type="text" id="lab-a-i" value="0">
        <input type="range"
               id="lab-a-s"
               min="-128"
               max="127"
               step="0.1"
               value="0">
      </div>

      <div class="row">
        <label>b</label>
        <input type="text" id="lab-b-i" value="0">
        <input type="range"
               id="lab-b-s"
               min="-128"
               max="127"
               step="0.1"
               value="0">
      </div>
    </div>


    <!-- CMYK -->
    <div class="panel">
      <h3>CMYK</h3>

      <div class="row">
        <label>C</label>
        <input type="text" id="cmyk-c-i" value="0">
        <input type="range"
               id="cmyk-c-s"
               min="0"
               max="100"
               step="0.1"
               value="0">
      </div>

      <div class="row">
        <label>M</label>
        <input type="text" id="cmyk-m-i" value="0">
        <input type="range"
               id="cmyk-m-s"
               min="0"
               max="100"
               step="0.1"
               value="0">
      </div>

      <div class="row">
        <label>Y</label>
        <input type="text" id="cmyk-y-i" value="0">
        <input type="range"
               id="cmyk-y-s"
               min="0"
               max="100"
               step="0.1"
               value="0">
      </div>

      <div class="row">
        <label>K</label>
        <input type="text" id="cmyk-k-i" value="0">
        <input type="range"
               id="cmyk-k-s"
               min="0"
               max="100"
               step="0.1"
               value="0">
      </div>
    </div>

  </div>
</div>


<script>

// ======================================================
// 颜色转换数学
// ======================================================

function clamp(v, mn, mx) {
  return Math.max(mn, Math.min(mx, v));
}


function round(v, d) {
  return Math.round(v * Math.pow(10, d)) / Math.pow(10, d);
}


// ======================================================
// RGB → XYZ
// ======================================================

function rgbToXyz(r, g, b) {

  let R = r / 255;
  let G = g / 255;
  let B = b / 255;

  const toLinear = c =>
    c <= 0.04045
      ? c / 12.92
      : Math.pow((c + 0.055) / 1.055, 2.4);

  R = toLinear(R);
  G = toLinear(G);
  B = toLinear(B);

  return [
    (R * 0.4124564 +
     G * 0.3575761 +
     B * 0.1804375) * 100,

    (R * 0.2126729 +
     G * 0.7151522 +
     B * 0.0721750) * 100,

    (R * 0.0193339 +
     G * 0.1191920 +
     B * 0.9503041) * 100
  ];
}


// ======================================================
// XYZ → RGB
// ======================================================

function xyzToRgb(x, y, z) {

  let X = x / 100;
  let Y = y / 100;
  let Z = z / 100;

  let R =
    X * 3.2404542 +
    Y * (-1.5371385) +
    Z * (-0.4985314);

  let G =
    X * (-0.9692660) +
    Y * 1.8760108 +
    Z * 0.0415560;

  let B =
    X * 0.0556434 +
    Y * (-0.2040259) +
    Z * 1.0572252;

  const toSrgb = c =>
    c <= 0.0031308
      ? 12.92 * c
      : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;

  return [
    toSrgb(R) * 255,
    toSrgb(G) * 255,
    toSrgb(B) * 255
  ];
}


// ======================================================
// XYZ → LAB
// ======================================================

function xyzToLab(x, y, z) {

  const refX = 95.047;
  const refY = 100;
  const refZ = 108.883;

  const f = t =>
    t > 0.008856
      ? Math.cbrt(t)
      : (7.787 * t + 16 / 116);

  const fx = f(x / refX);
  const fy = f(y / refY);
  const fz = f(z / refZ);

  return [
    116 * fy - 16,
    500 * (fx - fy),
    200 * (fy - fz)
  ];
}


// ======================================================
// LAB → XYZ
// ======================================================

function labToXyz(L, a, b) {

  const refX = 95.047;
  const refY = 100;
  const refZ = 108.883;

  let fy = (L + 16) / 116;
  let fx = a / 500 + fy;
  let fz = fy - b / 200;

  const inv = v =>
    v > 0.206893
      ? v * v * v
      : (v - 16 / 116) / 7.787;

  return [
    inv(fx) * refX,
    inv(fy) * refY,
    inv(fz) * refZ
  ];
}


// ======================================================
// RGB ↔ LAB
// ======================================================

function rgbToLab(r, g, b) {
  return xyzToLab(...rgbToXyz(r, g, b));
}


function labToRgb(L, a, b) {
  return xyzToRgb(...labToXyz(L, a, b));
}


// ======================================================
// RGB → CMYK
// ======================================================

function rgbToCmyk(r, g, b) {

  let R = r / 255;
  let G = g / 255;
  let B = b / 255;

  const K = 1 - Math.max(R, G, B);

  if (K >= 1) {
    return [0, 0, 0, 100];
  }

  return [
    (1 - R - K) / (1 - K) * 100,
    (1 - G - K) / (1 - K) * 100,
    (1 - B - K) / (1 - K) * 100,
    K * 100
  ];
}


// ======================================================
// CMYK → RGB
// ======================================================

function cmykToRgb(c, m, y, k) {

  return [
    255 * (1 - c / 100) * (1 - k / 100),
    255 * (1 - m / 100) * (1 - k / 100),
    255 * (1 - y / 100) * (1 - k / 100)
  ];
}


// ======================================================
// 任意输入映射
// ======================================================

function mapToRange(str, min, max) {

  str = str.trim();

  // 空输入
  if (str === '') {
    return min;
  }

  const num = parseFloat(str);

  // 数字输入
  if (!isNaN(num) && isFinite(num)) {

    // 改成限制范围，而不是原来的循环取模
    return clamp(num, min, max);
  }

  // 非数字字符串 → 哈希映射
  let h = 5381;

  for (let i = 0; i < str.length; i++) {
    h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
  }

  return min + (h % (max - min + 1));
}


// ======================================================
// DOM 引用
// ======================================================

const els = {

  rgb: {
    i: ['r', 'g', 'b'].map(
      k => document.getElementById('rgb-' + k + '-i')
    ),

    s: ['r', 'g', 'b'].map(
      k => document.getElementById('rgb-' + k + '-s')
    )
  },

  lab: {
    i: ['l', 'a', 'b'].map(
      k => document.getElementById('lab-' + k + '-i')
    ),

    s: ['l', 'a', 'b'].map(
      k => document.getElementById('lab-' + k + '-s')
    )
  },

  cmyk: {
    i: ['c', 'm', 'y', 'k'].map(
      k => document.getElementById('cmyk-' + k + '-i')
    ),

    s: ['c', 'm', 'y', 'k'].map(
      k => document.getElementById('cmyk-' + k + '-s')
    )
  },

  picker: document.getElementById('rgb-picker'),

  preview: document.getElementById('preview')
};


// ======================================================
// RGB → 更新所有面板
// ======================================================

function updateFromRgb(r, g, b, source) {

  // 限制 RGB
  r = clamp(r, 0, 255);
  g = clamp(g, 0, 255);
  b = clamp(b, 0, 255);


  // 转换
  const [L, a, b_] = rgbToLab(r, g, b);
  const [c, m, y, k] = rgbToCmyk(r, g, b);


  // ====================================================
  // RGB
  // ====================================================

  if (source !== 'rgb') {

    const vals = [
      Math.round(r),
      Math.round(g),
      Math.round(b)
    ];

    els.rgb.i.forEach((el, i) => {
      el.value = vals[i];
    });
  }

  // RGB 滑块始终同步
  els.rgb.s.forEach((el, i) => {

    el.value = [
      Math.round(r),
      Math.round(g),
      Math.round(b)
    ][i];

  });


  // ====================================================
  // 调色板
  // ====================================================

  els.picker.value =
    '#' +
    [Math.round(r), Math.round(g), Math.round(b)]
      .map(v =>
        clamp(Math.round(v), 0, 255)
          .toString(16)
          .padStart(2, '0')
      )
      .join('');


  // ====================================================
  // LAB
  // ====================================================

  if (source === 'lab') {

    // 用户正在修改 LAB
    // 保留输入框中的值
    // 但是让滑块跟着输入框同步

    const labValues = [
      mapToRange(els.lab.i[0].value, 0, 100),
      mapToRange(els.lab.i[1].value, -128, 127),
      mapToRange(els.lab.i[2].value, -128, 127)
    ];

    els.lab.s.forEach((el, i) => {
      el.value = labValues[i];
    });

  } else {

    // 其他模型发生变化
    // 重新计算 LAB

    const vals = [
      round(L, 2),
      round(a, 2),
      round(b_, 2)
    ];

    els.lab.i.forEach((el, i) => {
      el.value = vals[i];
    });

    els.lab.s.forEach((el, i) => {
      el.value = vals[i];
    });
  }


  // ====================================================
  // CMYK
  // ====================================================

  if (source === 'cmyk') {

    // 用户正在修改 CMYK
    // 保留输入框中的值
    // 但是让滑块跟着输入框同步

    const cmykValues = [
      mapToRange(els.cmyk.i[0].value, 0, 100),
      mapToRange(els.cmyk.i[1].value, 0, 100),
      mapToRange(els.cmyk.i[2].value, 0, 100),
      mapToRange(els.cmyk.i[3].value, 0, 100)
    ];

    els.cmyk.s.forEach((el, i) => {
      el.value = cmykValues[i];
    });

  } else {

    // 其他模型发生变化
    // 重新计算 CMYK

    const vals = [
      round(c, 2),
      round(m, 2),
      round(y, 2),
      round(k, 2)
    ];

    els.cmyk.i.forEach((el, i) => {
      el.value = vals[i];
    });

    els.cmyk.s.forEach((el, i) => {
      el.value = vals[i];
    });
  }


  // ====================================================
  // 颜色预览
  // ====================================================

  els.preview.style.background =
    `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`;
}


// ======================================================
// RGB 事件
// ======================================================

['r', 'g', 'b'].forEach((key, index) => {

  const input =
    document.getElementById('rgb-' + key + '-i');

  const slider =
    document.getElementById('rgb-' + key + '-s');


  // RGB 文本框
  input.addEventListener('input', () => {

    const values = [0, 1, 2].map(j =>
      mapToRange(
        els.rgb.i[j].value,
        0,
        255
      )
    );

    updateFromRgb(
      values[0],
      values[1],
      values[2],
      'rgb'
    );
  });


  // RGB 滑块
  slider.addEventListener('input', () => {

    input.value = slider.value;

    const values = [0, 1, 2].map(j =>
      Number(els.rgb.s[j].value)
    );

    updateFromRgb(
      values[0],
      values[1],
      values[2],
      'rgb'
    );
  });

});


// ======================================================
// LAB 事件
// ======================================================

['l', 'a', 'b'].forEach((key, index) => {

  const input =
    document.getElementById('lab-' + key + '-i');

  const slider =
    document.getElementById('lab-' + key + '-s');


  // LAB 文本框
  input.addEventListener('input', () => {

    const L =
      mapToRange(
        els.lab.i[0].value,
        0,
        100
      );

    const A =
      mapToRange(
        els.lab.i[1].value,
        -128,
        127
      );

    const B =
      mapToRange(
        els.lab.i[2].value,
        -128,
        127
      );


    const [r, g, b] =
      labToRgb(L, A, B);


    updateFromRgb(
      r,
      g,
      b,
      'lab'
    );
  });


  // LAB 滑块
  slider.addEventListener('input', () => {

    input.value = slider.value;


    const L =
      Number(els.lab.s[0].value);

    const A =
      Number(els.lab.s[1].value);

    const B =
      Number(els.lab.s[2].value);


    const [r, g, b] =
      labToRgb(L, A, B);


    updateFromRgb(
      r,
      g,
      b,
      'lab'
    );
  });

});


// ======================================================
// CMYK 事件
// ======================================================

['c', 'm', 'y', 'k'].forEach((key, index) => {

  const input =
    document.getElementById('cmyk-' + key + '-i');

  const slider =
    document.getElementById('cmyk-' + key + '-s');


  // CMYK 文本框
  input.addEventListener('input', () => {

    const values = [0, 1, 2, 3].map(j =>
      mapToRange(
        els.cmyk.i[j].value,
        0,
        100
      )
    );


    const [r, g, b] =
      cmykToRgb(
        values[0],
        values[1],
        values[2],
        values[3]
      );


    updateFromRgb(
      r,
      g,
      b,
      'cmyk'
    );
  });


  // CMYK 滑块
  slider.addEventListener('input', () => {

    input.value = slider.value;


    const c =
      Number(els.cmyk.s[0].value);

    const m =
      Number(els.cmyk.s[1].value);

    const y =
      Number(els.cmyk.s[2].value);

    const kk =
      Number(els.cmyk.s[3].value);


    const [r, g, b] =
      cmykToRgb(
        c,
        m,
        y,
        kk
      );


    updateFromRgb(
      r,
      g,
      b,
      'cmyk'
    );
  });

});


// ======================================================
// 调色板事件
// ======================================================

els.picker.addEventListener('input', () => {

  const hex = els.picker.value;

  const r =
    parseInt(
      hex.slice(1, 3),
      16
    );

  const g =
    parseInt(
      hex.slice(3, 5),
      16
    );

  const b =
    parseInt(
      hex.slice(5, 7),
      16
    );


  els.rgb.i[0].value = r;
  els.rgb.i[1].value = g;
  els.rgb.i[2].value = b;


  updateFromRgb(
    r,
    g,
    b,
    'rgb'
  );
});


// ======================================================
// 初始化
// ======================================================

updateFromRgb(
  120,
  180,
  200,
  'rgb'
);

</script>

</body>
</html>
